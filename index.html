<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="theme-color" content="#1a1512">
<title>Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="setup" hidden>
    <h1>Cards</h1>
    <p class="muted">One-time setup on this phone.</p>
    <label>Repo <input id="repo" placeholder="owner/repo" autocapitalize="off" autocomplete="off"></label>
    <label>Key <input id="token" type="password" placeholder="github_pat_…" autocomplete="off"></label>
    <button id="saveSetup">Save</button>
    <p class="muted small">The key stays only in this browser.</p>
  </section>

  <section id="home" hidden>
    <button id="forget" class="gear" aria-label="Key settings">⚙</button>
    <div class="homeTop">
      <h1>Cards</h1>
      <p id="greet" class="greet"></p>
      <p id="today" class="muted"></p>
      <div id="chips" class="chips"></div>
      <p id="homeInfo" class="muted small"></p>
    </div>
    <div class="homeBottom">
      <button id="start">Start a round</button>
      <button id="explainLater" class="ghost" hidden></button>
      <p id="pending" class="muted small"></p>
    </div>
  </section>

  <section id="play" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <div id="stack">
      <article id="card">
        <div id="band" class="band" hidden></div>
        <span id="family" class="chip"></span>
        <div id="statement" class="statement"></div>
        <div id="why" class="why" hidden></div>
        <div id="stampTrue" class="stamp true">TRUE ✓</div>
        <div id="stampFalse" class="stamp false">✗ FALSE</div>
        <div id="whyTab" class="whyTab" hidden>↑ Why</div>
      </article>
    </div>
    <div id="hint" class="hint"></div>
    <button id="unsure" class="unsure" hidden></button>
  </section>

  <section id="end" hidden>
    <div class="row"><div><h1 id="endTitle"></h1><p id="endSub" class="muted small"></p></div><button id="allLater" class="link">Fill all later</button></div>
    <p id="explainCount" class="muted small"></p>
    <div id="explainCard" class="exCard">
      <span id="exFamily" class="chip"></span>
      <div id="exStatement" class="exStatement"></div>
      <div id="exAnswer" class="ans"></div>
      <textarea id="exWhy" placeholder="Why did I think that? (optional, any language)"></textarea>
      <p class="muted small">← later · save &amp; next → · ↓ back</p>
      <div class="row btns"><button id="backOne" class="ghost">Back</button><button id="laterOne" class="ghost">Later</button><button id="nextOne">Save &amp; next</button></div>
    </div>
    <p id="saveMsg" class="muted small"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
